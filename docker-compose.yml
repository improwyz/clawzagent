# ClawZ platform stack (fleet/micro default).
# Pull prebuilt images:  docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up -d
# Build from source:     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - CLAWZ_MODE=micro
      - WORKER_URL=http://worker:50051
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/clawz
      - CLAWZ_PUBLIC_URL=https://${CLAWZ_DOMAIN:-localhost}
      - CLAWZ_WORKER_FLEET_URL=http://worker:50051
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks:
      - clawz-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:50051/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - CLAWZ_MODE=micro
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/clawz
      - CLAWZ_CONTROL_ADDR=0.0.0.0:50051
      - CLAWZ_AGENT_IMAGE=${CLAWZ_AGENT_IMAGE:-ghcr.io/improwyz/clawz-agent:latest}
      - CLAWZ_DOCKER_NETWORK=${CLAWZ_DOCKER_NETWORK:-clawz-net}
      - CLAWZ_MAX_AGENTS=${CLAWZ_MAX_AGENTS:-50}
      - CLAWZ_PUBLIC_URL=http://gateway:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./provider.toml:/etc/clawz/provider.toml:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clawz-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - clawz-net

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=clawz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clawz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clawz-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

networks:
  clawz-net:
    name: clawz-net
    driver: bridge

volumes:
  postgres-data:
  caddy_data:
  caddy_config:
