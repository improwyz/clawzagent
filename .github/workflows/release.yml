name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: improwyz

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: clawz-gateway
            dockerfile: Dockerfile.gateway
          - image: clawz-worker
            dockerfile: Dockerfile.worker
          - image: clawz-agent
            dockerfile: Dockerfile.agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: attach bare-metal binaries to the GitHub Release (not required for GHCR install).
  # The old softprops/upload-gh-release-assets action was removed from GitHub Marketplace.
  build-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            cross: x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            cross: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y "gcc-${{ matrix.cross }}" "binutils-${{ matrix.cross }}"

      - name: Build worker binary
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release -p clawz-worker --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/clawz-worker" "clawz-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawz-${{ matrix.arch }}
          path: clawz-${{ matrix.arch }}

  github-release:
    needs: [docker, build-binary]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with binary assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clawz-*

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify install script syntax
        run: |
          shellcheck scripts/install.sh scripts/install-common.sh || true
