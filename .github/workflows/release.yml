name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # =============================================================================
  # Multi-arch Docker build for T2 (containerized)
  # =============================================================================
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, linux/riscv64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/clawznet/worker:${{ github.ref_name }}-${{ matrix.platform }}
            ghcr.io/clawznet/worker:latest-${{ matrix.platform }}

  # =============================================================================
  # Build standalone binaries for T1/T3 (bare-metal + Tauri)
  # =============================================================================
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          - target: riscv64gc-unknown-linux-gnu
            arch: riscv64
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-cross-${{ matrix.arch }} binutils-${{ matrix.arch }}-linux-gnu

      - name: Build worker binary
        run: |
          cargo build --release --features t1 -p clawz-worker
          mv target/release/clawz-worker "clawz-${{ matrix.arch }}"

      - name: Upload Release Asset
        uses: softprops/upload-gh-release-assets@v2
        with:
          files: |
            clawz-${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # Verify install script
  # =============================================================================
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify install script syntax
        run: |
          shellcheck scripts/install.sh || true