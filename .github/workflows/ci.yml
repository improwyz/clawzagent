name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Desktop shell needs WebKit/GTK; server CI builds the agent platform only.
  CARGO_WORKSPACE_EXCLUDE: --exclude clawz-tauri

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --workspace ${{ env.CARGO_WORKSPACE_EXCLUDE }} --verbose

      - name: Run tests
        run: cargo test --workspace ${{ env.CARGO_WORKSPACE_EXCLUDE }} --verbose

      - name: Run doc tests
        run: cargo test --workspace ${{ env.CARGO_WORKSPACE_EXCLUDE }} --doc --verbose

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
          components: clippy

      - name: Run clippy
        run: cargo clippy --workspace ${{ env.CARGO_WORKSPACE_EXCLUDE }} -- -D warnings -A clippy::too-many-arguments

  fmt:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-smoke-${{ hashFiles('**/Cargo.lock') }}

      - name: Run smoke test
        run: ./scripts/smoke-test.sh

  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run compose smoke
        run: ./scripts/compose-smoke.sh

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.gateway
          load: true
          tags: clawz/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          load: true
          tags: clawz/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
