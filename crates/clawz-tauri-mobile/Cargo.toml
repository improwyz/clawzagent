[package]
name = "clawz-tauri-mobile"
version = "1.0.0"
edition = "2021"
license = "Elastic-2.0"
description = "ClawZ mobile shell scaffold (iOS/Android via Tauri 2)"
publish = false

[lib]
name = "clawz_tauri_mobile"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
