[package]
name = "clawz-setup"
version = "1.1.0"
edition = "2021"
license = "Elastic-2.0"
description = "ClawZ install & onboarding wizard — session state, persistence, state machine"
rust-version = "1.75"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
dirs = "6"
base64 = { workspace = true }
getrandom = "0.2"
sha2 = "0.10"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[dev-dependencies]
tempfile = "3"
