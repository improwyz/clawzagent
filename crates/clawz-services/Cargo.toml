[package]
name = "clawz-services"
version = "1.0.1"
edition = "2024"
license = "Elastic-2.0"
rust-version = "1.87"

[dependencies]
clawz-core = { path = "../clawz-core", version = "1.0.1" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
