[package]
name = "clawz-runtime"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time", "net"] }
async-trait = "0.1"
thiserror = "2"

[features]
default = ["tokio-rt"]
tokio-rt = ["tokio/rt-multi-thread"]
tokio-st = ["tokio/rt"]