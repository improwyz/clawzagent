<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawZ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --brand-copper: #B87333;
      --brand-silver: #C0C0C0;
      --brand-silver-light: #E8E8E8;
      --brand-silver-dark: #888888;
      --bg-page: #FAF7F4;
      --bg-surface: #FFFFFF;
      --bg-elevated: #FFFFFF;
      --fg-primary: #1A1410;
      --fg-secondary: #5C4D42;
      --fg-tertiary: #8B7D72;
      --border-subtle: #E8DDD4;
      --accent-primary: #B87333;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --radius-md: 10px;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    [data-theme="dark"] {
      --bg-page: #0D0F12;
      --bg-surface: #161A20;
      --bg-elevated: #1E2329;
      --fg-primary: #E8E8E8;
      --fg-secondary: #A8ACB2;
      --fg-tertiary: #6E747C;
      --border-subtle: #2A3038;
      --accent-primary: #C0C0C0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg-page);
      color: var(--fg-primary);
      min-height: 100vh;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    .sidebar {
      grid-row: 1 / -1;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border-subtle);
      padding: var(--spacing-lg);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      font-weight: 700;
      font-size: 1.125rem;
      color: var(--fg-primary);
    }

    .sidebar-logo img {
      height: 28px;
      width: auto;
    }

    .sidebar-item {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      color: var(--fg-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }

    .sidebar-item.active {
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--brand-silver-dark) 100%);
      color: #0D0F12;
    }

    [data-theme="light"] .sidebar-item.active {
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--brand-copper) 100%);
      color: #FFFFFF;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md) var(--spacing-lg);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .header-brand img {
      height: 32px;
      width: auto;
    }

    .header-brand span {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .main-content {
      padding: var(--spacing-lg);
    }

    .main-content h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: var(--spacing-sm);
    }

    .main-content p {
      color: var(--fg-secondary);
      max-width: 42rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="assets/branding/clawz-silver.png" alt="" class="sidebar-logo-img" id="sidebar-logo-img">
        ClawZ
      </div>
      <div class="sidebar-item active">Dashboard</div>
      <div class="sidebar-item">Agents</div>
      <div class="sidebar-item">Settings</div>
    </aside>

    <header class="app-header">
      <div class="header-brand">
        <img src="assets/branding/clawz-silver-f.png" alt="ClawZ" class="header-logo-img" id="header-logo-img">
      </div>
    </header>

    <main class="main-content">
      <h1>ClawZ Agent Runtime</h1>
      <p>Local desktop shell for the ClawZ agent orchestration platform.</p>
    </main>
  </div>

  <script>
    const branding = 'assets/branding/';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const icon = theme === 'dark' ? 'clawz-silver.png' : 'clawz-copper.png';
      const full = theme === 'dark' ? 'clawz-silver-f.png' : 'clawz-copper-f.png';
      document.getElementById('sidebar-logo-img').src = branding + icon;
      document.getElementById('header-logo-img').src = branding + full;
    }

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      applyTheme(e.matches ? 'dark' : 'light');
    });
  </script>
</body>
</html>
