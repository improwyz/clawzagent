[package]
name = "clawz-gateway"
version = "1.0.0"
edition = "2024"
license = "Elastic-2.0"
rust-version = "1.87"

[dependencies]
clawz-core = { path = "../clawz-core", version = "1.0.0" }
clawz-platform = { path = "../clawz-platform", version = "1.0.0" }
clawz-services = { path = "../clawz-services", version = "1.0.0" }
clawz-worker = { path = "../clawz-worker", version = "1.0.0" }
sqlx = { workspace = true }

# HTTP server
axum = { version = "0.8", features = ["ws", "macros", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde", "clock", "std"] }

# OpenAPI
utoipa = "4"

# Utilities
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
getrandom = "0.2"
log = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
