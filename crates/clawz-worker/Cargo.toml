[package]
name = "clawz-worker"
version = "1.0.1"
edition = "2024"
license = "Elastic-2.0"
rust-version = "1.87"

[dependencies]
clawz-core = { path = "../clawz-core", version = "1.0.1" }
clawz-platform = { path = "../clawz-platform", version = "1.0.1" }
clawz-services = { path = "../clawz-services", version = "1.0.1" }

# Control API
axum = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging
log = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
http = { workspace = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Concurrency
parking_lot = "0.12"

# Utilities
rand = "0.8"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.32"
base64 = "0.22"
regex = "1"

# Plugin system
libloading = "0.8"
notify = "7"

# Docker integration
bollard = "0.18"

# Async streaming
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"

# Crypto / signing
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

# Database
sqlx = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }

# Cron scheduling
cron = "0.12"

# Transport layer
quinn = "0.11"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
bytes = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

[[bin]]
name = "clawz-agent"
path = "src/bin/clawz-agent.rs"

[features]
esp32 = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
