[package]
name = "clawz-embedded"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# Point to local crates
clawz-core = { path = "../clawz-core" }
clawz-runtime = { path = "../clawz-runtime" }
clawz-platform = { path = "../clawz-platform" }

# Async trait needed for RuntimeBackend impl
async-trait = "0.1"

# For no_std we use heapless for bounded collections
heapless = { version = "0.8", optional = true }

# Panic handler
panic-halt = { version = "0.2", optional = true }

# Embassy executor for no_std embedded (optional)
embassy-executor = { version = "0.6", optional = true }
embassy-time = { version = "0.4", optional = true }
embedded-hal = { version = "0.2", optional = true }

# std build deps (for testing on host)
tokio = { version = "1", features = ["sync", "time"], default-features = false, optional = true }

[features]
default = ["std"]
# std builds a stub impl that satisfies RuntimeBackend for testing
std = ["dep:tokio"]
no_std = ["dep:heapless", "dep:panic-halt", "dep:embassy-executor", "dep:embassy-time", "dep:embedded-hal"]