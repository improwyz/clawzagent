# Overlay: pull platform images (GHCR primary; installer may fall back to Docker Hub).
# Usage: docker login ghcr.io && docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml pull

services:
  gateway:
    image: ${CLAWZ_GATEWAY_IMAGE:-${CLAWZ_REGISTRY:-ghcr.io/improwyz}/clawz-gateway:${CLAWZ_IMAGE_TAG:-latest}}
    pull_policy: if_not_present

  worker:
    image: ${CLAWZ_WORKER_IMAGE:-${CLAWZ_REGISTRY:-ghcr.io/improwyz}/clawz-worker:${CLAWZ_IMAGE_TAG:-latest}}
    pull_policy: if_not_present

  dashboard:
    profiles:
      - web
    image: ${CLAWZ_DASHBOARD_IMAGE:-${CLAWZ_REGISTRY:-ghcr.io/improwyz}/clawz-dashboard:${CLAWZ_IMAGE_TAG:-latest}}
    pull_policy: if_not_present
    ports:
      - "4173:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - clawz-net
